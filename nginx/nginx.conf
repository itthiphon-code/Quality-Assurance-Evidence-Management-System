# QA-EMS — Nginx reverse proxy (production)
# ให้บริการไฟล์ frontend ที่ build แล้ว และ proxy คำขอ /api/* ไปยัง backend container

server {
    listen 80;
    server_name _;

    # อัปโหลดหลักฐานได้สูงสุด 50MB ตามสเปก — ค่า default ของ Nginx (1MB) เล็กเกินไป
    client_max_body_size 55m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ไฟล์ใหญ่ใช้เวลาอัปโหลดนาน — ขยาย timeout เกิน default 60s
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA: เส้นทางที่ไม่ตรงไฟล์จริงให้ fallback ไปที่ index.html (react-router จัดการต่อ)
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
